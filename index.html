<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Words">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Word Generator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fafafa;--bg2:#f0f0f0;--bg3:#ffffff;
  --text:#111;--text2:#555;--text3:#999;
  --border:#e0e0e0;--accent:#6366f1;--accent2:#818cf8;
  --rap:#dc2626;--song:#2563eb;--ghazal:#059669;
  --card:#fff;--shadow:0 1px 4px rgba(0,0,0,.08);
  --r:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111;--bg2:#1a1a1a;--bg3:#222;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;--card:#1e1e1e;--shadow:0 1px 4px rgba(0,0,0,.4);
  }
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}

/* TOP BAR */
#top-bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden}
.lang-toggle button{padding:4px 14px;font-size:13px;font-weight:500;border-radius:20px;transition:all .15s}
.lang-toggle button.active{background:var(--accent);color:#fff}
.mode-toggle{display:flex;gap:4px;margin-left:auto}
.mode-btn{padding:4px 12px;font-size:12px;border-radius:20px;border:1px solid var(--border);color:var(--text2);transition:all .15s}
.mode-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
#session-btn{padding:4px 10px;font-size:12px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
#session-btn.active{background:#059669;color:#fff;border-color:#059669}
#session-countdown{font-size:13px;font-weight:500;color:var(--accent);min-width:36px;text-align:right}

/* PANELS */
#panels{flex:1;overflow-y:auto}
.panel{display:none;padding:16px}
.panel.active{display:block}

/* HOME PANEL */
#word-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 16px 16px;margin-bottom:12px;position:relative;
}
.word-timer-ring{position:absolute;top:10px;right:10px;width:36px;height:36px}
.word-timer-ring svg{transform:rotate(-90deg)}
.word-timer-ring circle{fill:none;stroke:var(--border);stroke-width:3}
.word-timer-ring .progress{stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
#word-main{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-bottom:4px}
#word-trans{font-size:16px;color:var(--text2);margin-bottom:2px}
#word-translit{font-size:13px;color:var(--text3);margin-bottom:10px}
.word-type-badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--text2);margin-bottom:8px}
#word-hint{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:12px}

/* LYRIC STYLE TOGGLE */
.lyric-style-row{display:flex;gap:6px;margin-bottom:8px}
.lyric-style-btn{flex:1;padding:5px;font-size:12px;border-radius:8px;border:1px solid var(--border);color:var(--text2);font-weight:500;transition:all .15s}
.lyric-style-btn.active[data-style="rap"]{background:var(--rap);color:#fff;border-color:var(--rap)}
.lyric-style-btn.active[data-style="song"]{background:var(--song);color:#fff;border-color:var(--song)}
.lyric-style-btn.active[data-style="ghazal"]{background:var(--ghazal);color:#fff;border-color:var(--ghazal)}

/* LYRIC BOX */
#lyric-box{
  background:var(--bg2);border-radius:10px;padding:12px 14px;cursor:pointer;
  border:1px solid transparent;transition:border-color .15s;position:relative;
}
#lyric-box:active{border-color:var(--accent)}
#lyric-text{font-size:14px;line-height:1.7;color:var(--text);font-style:italic}
#lyric-box .expand-hint{position:absolute;bottom:8px;right:10px;font-size:11px;color:var(--text3)}
#ghazal-ur{font-family:'Noto Nastaliq Urdu',serif;font-size:18px;line-height:2;direction:rtl;text-align:right}
#ghazal-en{font-size:13px;color:var(--text2);font-style:italic;margin-top:6px}

/* SEQUENCE DOTS */
.seq-row{display:flex;align-items:center;gap:6px;margin:12px 0 4px}
.seq-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .2s}
.seq-dot.filled{background:var(--accent)}
.seq-dot.solo{background:var(--text3);width:6px;height:6px}
.seq-dot.solo.filled{background:var(--text2)}
#review-badge{font-size:11px;background:var(--accent2);color:#fff;padding:2px 8px;border-radius:20px;margin-left:auto}

/* ACTION BUTTONS */
.action-row{display:flex;gap:8px;margin-top:12px}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:14px;color:var(--text2);font-weight:500;transition:all .15s;background:var(--card)}
.act-btn:active{transform:scale(.97);background:var(--bg2)}
.act-btn.starred i{color:#f59e0b}
.act-btn.hidden-w i{color:var(--rap)}
#next-btn{background:var(--text);color:var(--bg);border-color:var(--text);flex:2}

/* BOTTOM NAV */
#bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;font-size:10px;color:var(--text3);transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn i{font-size:20px}

/* TOPICS PANEL */
.topic-select-row{display:flex;gap:8px;margin-bottom:12px}
.topic-select-row select{flex:1}
.topic-words-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.topic-chip{padding:6px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:14px;cursor:pointer;transition:all .15s}
.topic-chip:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.add-topic-row{display:flex;gap:8px;margin-top:16px}
.add-topic-row input{flex:1}
.add-topic-row button{padding:8px 14px;border-radius:8px;background:var(--accent);color:#fff;font-weight:500;font-size:14px;flex-shrink:0}

/* JOURNAL PANEL */
.journal-entry{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.j-word{font-size:20px;font-weight:700}
.j-meta{font-size:12px;color:var(--text3);margin-top:2px}
.j-hint{font-size:13px;color:var(--text2);margin-top:4px}
.j-lyric{font-size:13px;font-style:italic;color:var(--text2);margin-top:6px;border-left:2px solid var(--border);padding-left:8px}
.j-actions{display:flex;gap:8px;margin-top:8px}
.j-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);color:var(--text2)}
.scores-section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.score-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}

/* PREFS PANEL */
.prefs-section{margin-bottom:20px}
.prefs-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:8px}
.hidden-word-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.hw-word{font-weight:600;flex:1}
.restore-btn{font-size:12px;padding:4px 10px;border-radius:6px;background:var(--accent);color:#fff}
.session-dur-row{display:flex;gap:8px;flex-wrap:wrap}
.dur-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);font-size:13px;color:var(--text2)}
.dur-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.word-timer-row{display:flex;gap:8px;margin-top:8px}
.wt-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:13px;color:var(--text2)}
.wt-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.corpus-actions{display:flex;gap:8px;margin-top:8px}
.corpus-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);font-size:13px;color:var(--text2)}
.corpus-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#corpus-stats{font-size:13px;color:var(--text3);margin-top:6px}

/* LYRIC STUDIO */
#lyric-studio{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;
  border-top:1px solid var(--border);padding:0 0 env(safe-area-inset-bottom,20px);
  transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;max-height:80dvh;overflow-y:auto;
}
#lyric-studio.open{transform:translateX(-50%) translateY(0)}
.studio-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.studio-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.studio-title{font-weight:600;font-size:16px}
.studio-close{font-size:24px;color:var(--text3);padding:4px}
.studio-style-row{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--border)}
.studio-style-btn{flex:1;padding:6px;font-size:12px;border-radius:8px;border:1px solid var(--border);color:var(--text2);font-weight:500}
.studio-style-btn.active[data-s="rap"]{background:var(--rap);color:#fff;border-color:var(--rap)}
.studio-style-btn.active[data-s="song"]{background:var(--song);color:#fff;border-color:var(--song)}
.studio-style-btn.active[data-s="ghazal"]{background:var(--ghazal);color:#fff;border-color:var(--ghazal)}
#studio-lines{padding:16px}
.studio-line{font-size:15px;font-style:italic;line-height:1.8;color:var(--text);opacity:0;transition:opacity .3s}
.studio-line.visible{opacity:1}
.studio-line.revealed{animation:fadeUp .4s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.studio-ur-line{font-family:'Noto Nastaliq Urdu',serif;font-size:20px;line-height:2.2;direction:rtl;text-align:right}
.studio-en-line{font-size:13px;color:var(--text2);font-style:italic}
.studio-reveal-btn{margin:0 16px 8px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:14px;color:var(--text2);width:calc(100% - 32px)}
.studio-save-btn{margin:8px 16px;padding:10px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;width:calc(100% - 32px)}

/* MEMORY TEST */
#memory-test{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:none;flex-direction:column;padding:20px 16px;max-width:480px;margin:0 auto;
}
#memory-test.active{display:flex}
.mt-progress{font-size:13px;color:var(--text3);margin-bottom:4px}
.mt-progress-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:24px;overflow:hidden}
.mt-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.mt-hint{font-size:22px;font-weight:600;line-height:1.4;margin-bottom:12px}
.mt-sub{font-size:14px;color:var(--text3);margin-bottom:28px}
.mt-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;align-content:start}
.mt-opt{padding:16px;border-radius:12px;border:1.5px solid var(--border);font-size:16px;font-weight:500;text-align:left;transition:all .15s}
.mt-opt:active{transform:scale(.97)}
.mt-opt.correct{background:#059669;color:#fff;border-color:#059669}
.mt-opt.wrong{background:var(--rap);color:#fff;border-color:var(--rap)}

/* SCORE SCREEN */
#score-screen{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;max-width:480px;margin:0 auto;
}
#score-screen.active{display:flex}
.score-emoji{font-size:64px;margin-bottom:12px}
.score-num{font-size:56px;font-weight:700;color:var(--accent)}
.score-label{font-size:16px;color:var(--text2);margin-top:4px;margin-bottom:24px}
.score-actions{display:flex;flex-direction:column;gap:10px;width:100%}
.score-btn{padding:12px;border-radius:12px;font-size:16px;font-weight:500;border:1.5px solid var(--border)}
.score-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* STUDIO OVERLAY BG */
#studio-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
#studio-bg.open{display:block}

/* WORD ANIMATION */
#word-main{transition:opacity .2s,transform .2s}
#word-main.fade{opacity:0;transform:translateY(-6px)}

/* URDU */
.ur-word{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}

/* SECTION HEADING */
.section-head{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;margin-top:4px}
.empty-state{text-align:center;color:var(--text3);font-size:14px;padding:32px 16px}
</style>
</head>
<body>

<div id="top-bar">
  <div class="lang-toggle">
    <button class="active" onclick="setLang('en')">EN</button>
    <button onclick="setLang('ur')">UR</button>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('normal')">Normal</button>
    <button class="mode-btn" onclick="setMode('hard')">Hard</button>
  </div>
  <button id="session-btn" onclick="toggleSession()">Start</button>
  <span id="session-countdown"></span>
</div>

<div id="panels">

  <!-- HOME -->
  <div class="panel active" id="panel-home">
    <div id="word-card">
      <div class="word-timer-ring" id="word-timer-ring" style="display:none">
        <svg viewBox="0 0 36 36" width="36" height="36">
          <circle cx="18" cy="18" r="15.5"/>
          <circle class="progress" id="timer-circle" cx="18" cy="18" r="15.5" stroke-dasharray="97.4 97.4" stroke-dashoffset="0"/>
        </svg>
      </div>
      <div id="word-main"></div>
      <div id="word-trans"></div>
      <div id="word-translit"></div>
      <span class="word-type-badge" id="word-type"></span>
      <div id="word-hint"></div>

      <div class="lyric-style-row">
        <button class="lyric-style-btn active" data-style="rap" onclick="setLyricStyle('rap')">Rap</button>
        <button class="lyric-style-btn" data-style="song" onclick="setLyricStyle('song')">Song</button>
        <button class="lyric-style-btn" data-style="ghazal" onclick="setLyricStyle('ghazal')">Ghazal</button>
      </div>

      <div id="lyric-box" onclick="openLyricStudio()">
        <div id="lyric-text"></div>
        <div id="ghazal-ur" style="display:none"></div>
        <div id="ghazal-en" style="display:none"></div>
        <span class="expand-hint">tap to expand</span>
      </div>

      <div class="seq-row">
        <div class="seq-dot" id="dot0"></div>
        <div class="seq-dot" id="dot1"></div>
        <div class="seq-dot" id="dot2"></div>
        <div class="seq-dot solo" id="dot3"></div>
        <span id="review-badge" style="display:none">Review</span>
      </div>
    </div>

    <div class="action-row">
      <button class="act-btn" id="star-btn" onclick="toggleStar()"><i class="ti ti-star"></i></button>
      <button class="act-btn" id="hide-btn" onclick="hideCurrentWord()"><i class="ti ti-eye-off"></i></button>
      <button class="act-btn" id="next-btn" onclick="nextWord()"><i class="ti ti-refresh"></i> New word</button>
    </div>
  </div>

  <!-- TOPICS -->
  <div class="panel" id="panel-topics">
    <div class="section-head">Topic</div>
    <div class="topic-select-row">
      <select id="topic-select" onchange="generateTopicWords()"></select>
    </div>
    <div id="topic-words-grid" class="topic-words-grid">
      <span class="empty-state">Select a topic to generate words</span>
    </div>
    <div class="add-topic-row">
      <input id="new-topic-input" placeholder="Add custom topic…" onkeydown="if(event.key==='Enter')addCustomTopic()">
      <button onclick="addCustomTopic()">Add</button>
    </div>
    <div id="custom-topics-list" style="margin-top:12px"></div>
  </div>

  <!-- JOURNAL -->
  <div class="panel" id="panel-journal">
    <div class="section-head">Starred words</div>
    <div id="journal-list"></div>
    <button onclick="exportJournal()" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);font-size:14px;color:var(--text2);margin-top:8px"><i class="ti ti-copy"></i> Export list</button>
    <div class="scores-section">
      <div class="section-head">Session scores</div>
      <div id="scores-list"></div>
    </div>
  </div>

  <!-- PREFS -->
  <div class="panel" id="panel-prefs">
    <div class="prefs-section">
      <div class="prefs-label">Session duration</div>
      <div class="session-dur-row" id="dur-row">
        <button class="dur-btn" data-d="5">5 min</button>
        <button class="dur-btn active" data-d="10">10 min</button>
        <button class="dur-btn" data-d="15">15 min</button>
        <button class="dur-btn" data-d="20">20 min</button>
      </div>
    </div>
    <div class="prefs-section">
      <div class="prefs-label">Per-word timer</div>
      <div class="word-timer-row" id="wt-row">
        <button class="wt-btn" data-wt="0">Off</button>
        <button class="wt-btn active" data-wt="15">15s</button>
        <button class="wt-btn" data-wt="30">30s</button>
        <button class="wt-btn" data-wt="60">60s</button>
      </div>
    </div>
    <div class="prefs-section">
      <div class="prefs-label">Personal text corpus</div>
      <textarea id="corpus-input" placeholder="Paste your own writing, notes, phrases… The app will extract words and use your phrases in lyrics."></textarea>
      <div class="corpus-actions">
        <button class="corpus-btn primary" onclick="processCorpus()">Extract words</button>
        <button class="corpus-btn" onclick="clearCorpus()">Clear</button>
      </div>
      <div id="corpus-stats"></div>
    </div>
    <div class="prefs-section">
      <div class="prefs-label">Hidden words</div>
      <div id="hidden-words-list"><div class="empty-state" style="padding:12px 0">No hidden words</div></div>
    </div>
  </div>

</div>

<nav id="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('home')"><i class="ti ti-home"></i>Home</button>
  <button class="nav-btn" onclick="switchTab('topics')"><i class="ti ti-tag"></i>Topics</button>
  <button class="nav-btn" onclick="switchTab('journal')"><i class="ti ti-star"></i>Journal</button>
  <button class="nav-btn" onclick="switchTab('prefs')"><i class="ti ti-settings"></i>Prefs</button>
</nav>

<!-- LYRIC STUDIO -->
<div id="studio-bg" onclick="closeLyricStudio()"></div>
<div id="lyric-studio">
  <div class="studio-handle"></div>
  <div class="studio-header">
    <span class="studio-title" id="studio-word"></span>
    <button class="studio-close" onclick="closeLyricStudio()"><i class="ti ti-x"></i></button>
  </div>
  <div class="studio-style-row">
    <button class="studio-style-btn active" data-s="rap" onclick="setStudioStyle('rap')">Rap</button>
    <button class="studio-style-btn" data-s="song" onclick="setStudioStyle('song')">Song</button>
    <button class="studio-style-btn" data-s="ghazal" onclick="setStudioStyle('ghazal')">Ghazal</button>
  </div>
  <div id="studio-lines"></div>
  <button class="studio-reveal-btn" id="studio-reveal-btn" onclick="revealNextLine()">Show next line</button>
  <button class="studio-save-btn" onclick="saveVerse()"><i class="ti ti-star"></i> Save full verse</button>
</div>

<!-- MEMORY TEST -->
<div id="memory-test">
  <div class="mt-progress" id="mt-progress">Question 1 of 8</div>
  <div class="mt-progress-bar"><div class="mt-progress-fill" id="mt-fill" style="width:0%"></div></div>
  <div class="mt-hint" id="mt-hint"></div>
  <div class="mt-sub" id="mt-sub">Which word matches this hint?</div>
  <div class="mt-options" id="mt-options"></div>
</div>

// ===================== STORAGE =====================
function ld(k,fb){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):fb}catch{return fb}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

// ===================== POOL =====================
function getPool(){
  const hidden=new Set(ld('wg-hidden',[]));
  const base=WORDS[S.lang].filter(w=>{
    if(hidden.has(w.w)) return false;
    if(S.mode==='normal'&&w.hd) return false;
    return true;
  });
  const corpus=ld('wg-corpus-words',[]);
  return [...base,...corpus.filter(w=>!hidden.has(w.w))];
}

// Cross-session recency: words shown recently (persisted) are avoided until the pool cycles
function getRecent(){ return ld('wg-recent',[]); }
function pushRecent(w){
  let r=ld('wg-recent',[]).filter(x=>x!==w); r.push(w);
  const cap=Math.min(40,Math.max(12,Math.floor(getPool().length*0.6)));
  while(r.length>cap) r.shift();
  sv('wg-recent',r);
}
// Bring back a starred word only if it hasn't been reviewed for >=3 sessions
function pickDueReview(){
  const sc=ld('wg-session-count',0);
  const fav=ld('wg-favourites',[]);
  const due=fav.filter(f=>(sc-(f.lastSession??sc))>=3 && !S.seenWords.includes(f.w) && !S.reviewedThisSession.includes(f.w));
  if(!due.length) return null;
  const pick=due[Math.floor(Math.random()*due.length)];
  const found=WORDS[S.lang].find(w=>w.w===pick.w)||WORDS.en.find(w=>w.w===pick.w)||WORDS.ur.find(w=>w.w===pick.w);
  if(!found) return null;
  found._review=true;
  S.reviewedThisSession.push(pick.w);
  const idx=fav.findIndex(f=>f.w===pick.w);
  if(idx>=0){ fav[idx].lastSession=sc; sv('wg-favourites',fav); }
  return found;
}

function buildFamilies(pool){
  const fam={};
  for(const w of pool){
    const k=w.r+'_'+w.s;
    if(!fam[k])fam[k]=[];
    fam[k].push(w);
  }
  return fam;
}

function pickFamily(pool,lastKey,targetSyl){
  const fam=buildFamilies(pool);
  const seen=new Set(S.seenWords), recent=new Set(getRecent());
  const fresh=ws=>ws.filter(w=>!seen.has(w.w)&&!recent.has(w.w)).length;
  // Among a tier of candidate families, prefer the one with the most fresh words
  function choose(cands){
    if(!cands.length) return null;
    const max=Math.max(...cands.map(([,ws])=>fresh(ws)));
    const top=cands.filter(([,ws])=>fresh(ws)===max);
    const from=top.length?top:cands;
    return from[Math.floor(Math.random()*from.length)][1];
  }
  // Priority 1: same syllable count, different rhyme key
  let r=choose(Object.entries(fam).filter(([k,ws])=>ws.length>=3&&!k.startsWith((lastKey||'NONE')+'_')&&k.endsWith('_'+targetSyl)));
  if(r) return r;
  // Priority 2: different rhyme key, any syllable count
  r=choose(Object.entries(fam).filter(([k,ws])=>ws.length>=3&&!k.startsWith((lastKey||'NONE')+'_')));
  if(r) return r;
  // Priority 3: any family with enough words
  r=choose(Object.entries(fam).filter(([,ws])=>ws.length>=3));
  if(r) return r;
  return pool;
}

// ===================== RHYME ENGINE =====================
function nextWord(){
  const pool=getPool();
  if(!pool.length) return;

  let entry;
  const R=S.rhyme;

  // Cross-session spaced repetition: only during an active session, surface a
  // starred word that hasn't been reviewed for >=3 sessions (not within-session)
  if(S.session.active && S.wordCount>0 && S.wordCount%9===0){
    entry=pickDueReview();
  }

  if(!entry){
    const seen=new Set(S.seenWords), recent=new Set(getRecent());
    const choose=arr=>arr[Math.floor(Math.random()*arr.length)];
    if(R.phase==='rhyme'){
      if(!R.family.length){ R.family=pickFamily(pool,R.lastKey,R.targetSyl); R.runUsed=[]; }
      const used=new Set(R.runUsed);
      const cands=R.family.filter(w=>!used.has(w.w));           // never repeat within a rhyme run
      let pref=cands.filter(w=>!seen.has(w.w)&&!recent.has(w.w)); // prefer fresh
      if(!pref.length) pref=cands.filter(w=>!seen.has(w.w));      // then unseen this session
      if(!pref.length) pref=cands.length?cands:R.family;         // last resort
      entry=choose(pref);
      R.runUsed.push(entry.w);
      R.count++;
      if(R.count>=3){ R.lastKey=R.family[0]?.r; R.targetSyl=R.family[0]?.s||3; R.phase='solo'; R.count=0; R.family=[]; R.runUsed=[]; }
    } else {
      const cands=pool.filter(w=>w.r!==R.lastKey);
      let pref=cands.filter(w=>!seen.has(w.w)&&!recent.has(w.w));
      if(!pref.length) pref=cands.filter(w=>!seen.has(w.w));
      if(!pref.length) pref=cands.length?cands:pool;
      entry=choose(pref);
      R.phase='rhyme'; R.family=[]; R.runUsed=[];
    }
  }

  S.current=entry;
  S.wordCount++;
  S.seenWords.push(entry.w);
  pushRecent(entry.w);
  renderWord(entry);
  if(S.wordTimer.active) startWordTimer();
}

// ===================== RENDER WORD =====================
function renderWord(e){
  const isEN=S.lang==='en';
  const wordEl=document.getElementById('word-main');
  wordEl.classList.add('fade');
  setTimeout(()=>{
    if(isEN){
      wordEl.textContent=e.w;
      wordEl.className='';
      document.getElementById('word-trans').innerHTML=`<span class="ur-word">${e.u||''}</span>`;
      document.getElementById('word-translit').textContent=e.ut?`(${e.ut})`:'';
    } else {
      wordEl.innerHTML=`<span class="ur-word">${e.w}</span>`;
      wordEl.className='';
      document.getElementById('word-trans').textContent=e.e||'';
      document.getElementById('word-translit').textContent=e.wt?`(${e.wt})`:'';
    }
    document.getElementById('word-type').textContent=e.t||'';
    document.getElementById('word-hint').textContent=isEN?e.h:(e.hen||e.h);
    renderLyric(e);
    renderDots();
    const rb=document.getElementById('review-badge');
    rb.style.display=e._review?'inline-block':'none';
    e._review=false;
    // Update star button
    const fav=ld('wg-favourites',[]);
    const starred=fav.some(f=>f.w===e.w);
    document.getElementById('star-btn').className='act-btn'+(starred?' starred':'');
  },200);
}

function renderLyric(e){
  const ls=S.lyricStyle;
  const lyricBox=document.getElementById('lyric-box');
  const lyricText=document.getElementById('lyric-text');
  const ghazalUr=document.getElementById('ghazal-ur');
  const ghazalEn=document.getElementById('ghazal-en');
  if(ls==='ghazal'){
    lyricText.style.display='none';
    ghazalUr.style.display='block';
    ghazalEn.style.display='block';
    ghazalUr.textContent=(e.gu||[''])[0]+(e.gu?('\n'+(e.gu[1]||'')):'');
    ghazalEn.textContent=(e.ge||['',''])[0]+'\n'+(e.ge?e.ge[1]:'');
  } else {
    lyricText.style.display='block';
    ghazalUr.style.display='none';
    ghazalEn.style.display='none';
    const lines=ls==='rap'?e.rap:e.sng;
    lyricText.textContent=lines?(lines[0]+'\n'+lines[1]):'';
  }
}

function renderDots(){
  const R=S.rhyme;
  const count=R.phase==='rhyme'?R.count:3;
  for(let i=0;i<3;i++){
    document.getElementById('dot'+i).classList.toggle('filled',i<count);
  }
  document.getElementById('dot3').classList.toggle('filled',R.phase==='solo');
}

// ===================== SESSION TIMER =====================
function toggleSession(){
  if(S.session.active){ stopSession(); return; }
  startSession();
}
function startSession(){
  S.session.active=true;
  S.session.remain=S.session.dur*60;
  S.seenWords=[];S.wordCount=0;
  S.reviewedThisSession=[];
  sv('wg-session-count',ld('wg-session-count',0)+1);
  document.getElementById('session-btn').textContent='Stop';
  document.getElementById('session-btn').classList.add('active');
  S.session.interval=setInterval(tickSession,1000);
  nextWord();
  if(S.wordTimer.dur>0){ S.wordTimer.active=true; startWordTimer(); }
}
function tickSession(){
  S.session.remain--;
  const m=Math.floor(S.session.remain/60);
  const s=S.session.remain%60;
  document.getElementById('session-countdown').textContent=`${m}:${s.toString().padStart(2,'0')}`;
  if(S.session.remain<=0) endSession();
}
function stopSession(){
  clearInterval(S.session.interval);
  clearInterval(S.wordTimer.interval);
  S.session.active=false;S.wordTimer.active=false;
  document.getElementById('session-btn').textContent='Start';
  document.getElementById('session-btn').classList.remove('active');
  document.getElementById('session-countdown').textContent='';
  document.getElementById('word-timer-ring').style.display='none';
}
function endSession(){
  stopSession();
  if(S.seenWords.length>=3) startMemoryTest();
}

// ===================== WORD TIMER =====================
function startWordTimer(){
  clearInterval(S.wordTimer.interval);
  if(!S.wordTimer.dur) return;
  S.wordTimer.remain=S.wordTimer.dur;
  document.getElementById('word-timer-ring').style.display='block';
  updateTimerRing(1);
  S.wordTimer.interval=setInterval(()=>{
    S.wordTimer.remain--;
    updateTimerRing(S.wordTimer.remain/S.wordTimer.dur);
    if(S.wordTimer.remain<=0) nextWord();
  },1000);
}
function updateTimerRing(pct){
  const circ=97.4;
  document.getElementById('timer-circle').style.strokeDashoffset=circ*(1-pct);
}

// ===================== STAR / HIDE =====================
function toggleStar(){
  if(!S.current) return;
  const e=S.current;
  let fav=ld('wg-favourites',[]);
  const idx=fav.findIndex(f=>f.w===e.w);
  if(idx>=0) fav.splice(idx,1);
  else fav.unshift({w:e.w,t:e.t,h:S.lang==='en'?e.h:e.hen||e.h,
    rap:e.rap?e.rap[0]+'\n'+e.rap[1]:'',lang:S.lang,
    savedAt:Date.now(),reviewCount:0,lastSession:ld('wg-session-count',0)});
  sv('wg-favourites',fav);
  const starred=idx<0;
  document.getElementById('star-btn').className='act-btn'+(starred?' starred':'');
  renderJournal();
}

function hideCurrentWord(){
  if(!S.current) return;
  const hidden=ld('wg-hidden',[]);
  if(!hidden.includes(S.current.w)){
    hidden.push(S.current.w);
    sv('wg-hidden',hidden);
  }
  renderHiddenWords();
  nextWord();
}

// ===================== MEMORY TEST =====================
let mtWords=[],mtIdx=0,mtCorrect=0,mtMissed=[];
function startMemoryTest(){
  const seen=[...new Set(S.seenWords)];
  const pool=WORDS[S.lang];
  mtWords=seen.slice(-Math.min(seen.length,10))
    .map(w=>pool.find(e=>e.w===w)).filter(Boolean);
  if(mtWords.length<3){endMemoryTest();return;}
  mtIdx=0;mtCorrect=0;mtMissed=[];
  document.getElementById('memory-test').classList.add('active');
  renderMTQuestion();
}
function renderMTQuestion(){
  if(mtIdx>=mtWords.length){showScore();return;}
  const e=mtWords[mtIdx];
  const total=mtWords.length;
  document.getElementById('mt-progress').textContent=`Question ${mtIdx+1} of ${total}`;
  document.getElementById('mt-fill').style.width=`${(mtIdx/total)*100}%`;
  document.getElementById('mt-hint').textContent=S.lang==='en'?e.h:e.hen||e.h;
  // Build options
  const pool=WORDS[S.lang];
  const wrong=pool.filter(w=>w.w!==e.w).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[e,...wrong].sort(()=>Math.random()-.5);
  const c=document.getElementById('mt-options');
  c.innerHTML=opts.map(o=>`<button class="mt-opt" onclick="checkAnswer(this,'${o.w}','${e.w}')">${o.w}</button>`).join('');
}
function checkAnswer(btn,chosen,correct){
  document.querySelectorAll('.mt-opt').forEach(b=>b.disabled=true);
  btn.classList.add(chosen===correct?'correct':'wrong');
  if(chosen===correct) mtCorrect++;
  else { mtMissed.push(correct); document.querySelector(`.mt-opt[onclick*="'${correct}'"]`)?.classList.add('correct'); }
  mtIdx++;
  setTimeout(renderMTQuestion,900);
}
function showScore(){
  document.getElementById('memory-test').classList.remove('active');
  const pct=Math.round((mtCorrect/mtWords.length)*100);
  document.getElementById('score-emoji').textContent=pct>=80?'🎯':pct>=50?'💪':'📚';
  document.getElementById('score-num').textContent=`${mtCorrect}/${mtWords.length}`;
  document.getElementById('score-label').textContent=`${pct}% — ${pct>=80?'Excellent!':pct>=50?'Good work!':'Keep practising!'}`;
  document.getElementById('score-screen').classList.add('active');
  const scores=ld('wg-scores',[]);
  scores.unshift({date:Date.now(),correct:mtCorrect,total:mtWords.length});
  sv('wg-scores',scores.slice(0,20));
  renderScores();
}
function reviewMissed(){
  document.getElementById('score-screen').classList.remove('active');
  if(mtMissed.length){
    const pool=WORDS[S.lang];
    const entry=pool.find(w=>w.w===mtMissed[0]);
    if(entry){S.current=entry;renderWord(entry);}
  }
}
function endMemoryTest(){
  document.getElementById('memory-test').classList.remove('active');
  document.getElementById('score-screen').classList.remove('active');
}

  const sel=document.getElementById('topic-select');
  sel.innerHTML='<option value="">Select topic…</option>'+all.map(t=>`<option>${t}</option>`).join('');

function addCustomTopic(){
  const inp=document.getElementById('new-topic-input');
  const t=inp.value.trim();
  if(!t) return;
  const custom=ld('wg-topics',[]);
  if(!custom.includes(t)) custom.push(t);
  sv('wg-topics',custom);
  inp.value='';
  buildTopicSelect();
}
function removeCustomTopic(t){
  let custom=ld('wg-topics',[]);
  custom=custom.filter(c=>c!==t);
  sv('wg-topics',custom);
  buildTopicSelect();
}
function generateTopicWords(){
  const topic=document.getElementById('topic-select').value;
  const grid=document.getElementById('topic-words-grid');
  if(!topic){grid.innerHTML='<span class="empty-state">Select a topic</span>';return;}
  const pool=TOPIC_POOLS[topic]||[];
  // Also include any words from either language that match
  const allW=[...WORDS.en,...WORDS.ur];
  const extra=allW.filter(w=>w.h?.toLowerCase().includes(topic)||w.w?.toLowerCase().includes(topic)).map(w=>w.w);
  const combined=[...new Set([...pool,...extra])].sort(()=>Math.random()-.5).slice(0,12);
  grid.innerHTML=combined.map(w=>`<span class="topic-chip" onclick="showTopicWord('${w}')">${w}</span>`).join('');
}
function showTopicWord(wStr){
  const entry=[...WORDS.en,...WORDS.ur].find(w=>w.w===wStr);
  if(!entry) return;
  switchTab('home');
  S.current=entry;
  renderWord(entry);
}

// ===================== CORPUS =====================
function processCorpus(){
  const text=document.getElementById('corpus-input').value;
  if(!text.trim()) return;
  const tokens=text.toLowerCase().match(/\b[a-z']{4,}\b/g)||[];
  const words=[...new Set(tokens.filter(t=>!STOP_WORDS.has(t)))];
  // Build simple word entries from extracted words
  const entries=words.slice(0,50).map(w=>({
    w,u:'',ut:'',t:'noun',s:countSyl(w),r:getRhymeKey(w),hd:false,
    h:`from your personal text`,
    rap:[`I found the word "${w}" living in my own writing,`,"A piece of my own world that I found worth reciting.","The words we use reveal the life we're building here,","Every piece of text becomes a mirror, sharp and clear."],
    sng:[`"${w}" — a word from my own hand and mind,`,"The kind of word my own experience left behind.","We write ourselves into the words we choose to use,","The personal vocabulary is the one we rarely lose."],
    gu:['اپنے الفاظ میں اپنا چہرہ دیکھو','لکھی ہوئی باتوں میں اپنی جھلک دیکھو'],
    ge:["Look for your own face in the words you use,","In what you've written, find the self you choose."]
  }));
  sv('wg-corpus-words',entries);
  document.getElementById('corpus-stats').textContent=`✓ ${entries.length} words extracted from your text`;
}
function clearCorpus(){
  sv('wg-corpus-words',[]);
  document.getElementById('corpus-stats').textContent='Corpus cleared.';
}
function countSyl(w){
  const m=w.match(/[aeiouy]+/gi);return Math.max(1,m?m.length:1);
}
function getRhymeKey(w){
  return w.slice(-3)||w;
}

// ===================== LYRIC STUDIO =====================
function openLyricStudio(){
  if(!S.current) return;
  S.studioLines=2;S.studioMax=4;
  document.getElementById('studio-word').textContent=S.current.w;
  document.getElementById('studio-bg').classList.add('open');
  document.getElementById('lyric-studio').classList.add('open');
  setStudioStyle(S.lyricStyle);
  document.querySelectorAll('.studio-style-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===S.lyricStyle));
}
function closeLyricStudio(){
  document.getElementById('studio-bg').classList.remove('open');
  document.getElementById('lyric-studio').classList.remove('open');
}
function setStudioStyle(s){
  S.lyricStyle=s;
  document.querySelectorAll('.studio-style-btn').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
  document.querySelectorAll('.lyric-style-btn').forEach(b=>b.classList.toggle('active',b.dataset.style===s));
  if(!S.current) return;
  const e=S.current;
  const lines=s==='ghazal'?null:(s==='rap'?e.rap:e.sng);
  const el=document.getElementById('studio-lines');
  if(s==='ghazal'){
    const g2=G2[e.w];
    let html=`<div class="studio-line visible">`
      +`<div class="studio-ur-line">${(e.gu||[]).join('<br>')}</div>`
      +`<div class="studio-en-line">${(e.ge||[]).join('<br>')}</div></div>`;
    if(g2){
      html+=`<div class="studio-line">`
        +`<div class="studio-ur-line">${g2.u.join('<br>')}</div>`
        +`<div class="studio-en-line">${g2.e.join('<br>')}</div></div>`;
    }
    el.innerHTML=html;
    S.studioLines=1;S.studioMax=g2?2:1;
    const rb=document.getElementById('studio-reveal-btn');
    rb.textContent='Show next couplet';
    rb.style.display=g2?'block':'none';
  } else if(lines){
    el.innerHTML=lines.map((l,i)=>`<div class="studio-line${i<2?' visible':''}">${l}</div>`).join('');
    S.studioLines=2;S.studioMax=lines.length;
    const rb=document.getElementById('studio-reveal-btn');
    rb.textContent='Show next line';
    rb.style.display=S.studioLines<S.studioMax?'block':'none';
  }
}
function revealNextLine(){
  const lines=document.querySelectorAll('#studio-lines .studio-line');
  if(S.studioLines<lines.length){
    lines[S.studioLines].classList.add('visible','revealed');
    S.studioLines++;
  }
  document.getElementById('studio-reveal-btn').style.display=S.studioLines<lines.length?'block':'none';
}
function saveVerse(){
  if(!S.current) return;
  const e=S.current;
  const fav=ld('wg-favourites',[]);
  const idx=fav.findIndex(f=>f.w===e.w);
  let verse;
  if(S.lyricStyle==='ghazal'){
    const g2=G2[e.w];
    const ur=[...(e.gu||[]),...(g2?g2.u:[])].join('\n');
    const en=[...(e.ge||[]),...(g2?g2.e:[])].join('\n');
    verse=ur+'\n—\n'+en;
  } else {
    verse=((S.lyricStyle==='rap'?e.rap:e.sng)||[]).join('\n');
  }
  if(idx>=0) fav[idx].verse=verse;
  else fav.unshift({w:e.w,t:e.t,h:e.h||e.hen,rap:verse,lang:S.lang,savedAt:Date.now(),reviewCount:0,lastSession:ld('wg-session-count',0)});
  sv('wg-favourites',fav);
  renderJournal();
  closeLyricStudio();
}

// ===================== TAB SWITCHING =====================
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    const tabs=['home','topics','journal','prefs'];
    b.classList.toggle('active',tabs[i]===tab);
  });
  if(tab==='journal'){renderJournal();renderScores();}
  if(tab==='prefs'){renderHiddenWords();}
}

// ===================== TOUCH SWIPE =====================
let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(S.tab!=='home') return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>60){
    if(dx<0) nextWord();
    else toggleStar();
  }
},{passive:true});

// ===================== INIT =====================
function init(){
  S.session.dur=ld('wg-session-dur',10);
  S.wordTimer.dur=ld('wg-word-timer',15);
  initPrefs();
  buildTopicSelect();
  renderHiddenWords();
  nextWord();
}
init();
</script>
